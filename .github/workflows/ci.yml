name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 11+ 使用 pnpm/setup（pnpm/action-setup 面向 v10 及更早）。
      # 不传 version：以 package.json 的 packageManager（pnpm@11.7.0）为单一事实源，
      # 避免双源冲突（ERR_PNPM_BAD_PM_VERSION）。
      # install: false：link: 依赖指向兄弟目录 harness，须先克隆再安装。
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      # 依赖以 link: 指向兄弟目录的 deepseek-harness 检出（与本地开发环境一致）。
      - name: Checkout deepseek-harness (sibling)
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness ../deepseek-harness

      # 构建完整 lib（host + client 两半区）：host 包类型供插件 host 半区 typecheck，
      # client 包类型（dsh-client-*）供浏览器半区 typecheck —— lib/ 不入库，必须构建。
      - name: Build harness lib
        working-directory: ../deepseek-harness
        run: |
          pnpm install
          pnpm run build:lib

      - name: Install plugin dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke test (host bundle)
        run: node scripts/smoke.mjs
