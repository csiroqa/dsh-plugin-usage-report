name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 11+ 使用 pnpm/setup（pnpm/action-setup 面向 v10 及更早，
      # 与 packageManager 声明的 pnpm@11.7.0 存在版本冲突）；同时安装 Node 22。
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      # 依赖以 link: 指向兄弟目录的 deepseek-harness 检出（与本地开发环境一致）。
      - name: Checkout deepseek-harness (sibling)
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness ../deepseek-harness

      - name: Build harness host half
        working-directory: ../deepseek-harness
        run: |
          pnpm install
          pnpm run build:lib:host

      - name: Install plugin dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke test (host bundle)
        run: node scripts/smoke.mjs
